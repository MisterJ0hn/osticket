# Pasa las variables de entorno del contenedor a PHP, donde quedan en
# $_SERVER. Con mod_php getenv() ya las ve, pero esto lo deja garantizado
# (y seguiría funcionando si algún día se pasa a php-fpm o CGI):
# ost-config.docker.php consulta getenv() y cae a $_SERVER.
#
# Se monta en /etc/apache2/conf-enabled/ desde el docker-compose.yml de la
# raíz, en vez de tocar docker/apache.conf, que comparten los otros dos
# composes. Todas estas variables las define siempre ese compose, así que
# Apache no arranca quejándose de variables indefinidas.

PassEnv OSTICKET_DBHOST
PassEnv OSTICKET_DBNAME
PassEnv OSTICKET_DBUSER
PassEnv OSTICKET_DBPASS
PassEnv OSTICKET_TABLE_PREFIX
PassEnv OSTICKET_SECRET_SALT
PassEnv OSTICKET_ADMIN_EMAIL
PassEnv OSTICKET_TRUSTED_PROXIES
PassEnv OSTICKET_LOCAL_NETWORKS
