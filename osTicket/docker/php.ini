; Configuración PHP para osTicket
; osTicket viene configurado para aceptar archivos de hasta 32 MB
; (ost_config.max_file_size = 33554432). Estos límites tienen que quedar POR
; ENCIMA de eso o el propio PHP corta la petición antes de que osTicket la
; vea, y encima con adjuntos que llegan en base64 por la API el cuerpo pesa
; ~33% más que el archivo: 32 MB de imagen viajan como ~43 MB de JSON.
upload_max_filesize = 48M
post_max_size = 48M
max_execution_time = 120
; Decodificar un adjunto grande tiene varias copias en memoria a la vez (el
; JSON crudo, el decodificado y el binario). Con 256M, un correo con un par
; de fotos agotaba la memoria: PHP muere con un fatal, Apache responde 500 y
; la API lo interpreta como "osTicket caído" y cae al fallback SQL, que es
; justo el camino que descarta los adjuntos.
memory_limit = 512M
date.timezone = America/Santiago

; Para usar SMTP real via msmtp, configura docker/msmtp.conf y descomenta:
; sendmail_path = /usr/bin/msmtp -t --read-envelope-from
