# Configuración msmtp para envío de correo
# Copia este archivo al contenedor montándolo en docker-compose.yml:
#   - ./docker/msmtp.conf:/etc/msmtprc:ro,z

defaults
auth           on
tls            on
tls_trust_file /etc/ssl/certs/ca-certificates.crt
logfile        /var/log/msmtp.log

account        default
host           smtp.gmail.com
port           587
from           desarrollo.ti@alfaromadariaga.cl
user           desarrollo.ti@alfaromadariaga.cl
password       Mister070382$$
